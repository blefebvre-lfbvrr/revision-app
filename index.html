<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révisions · FGE2-S4</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080b10;--surface:#111620;--surface2:#182030;--border:#1e2840;
  --blue:#00c8ff;--blue-dim:rgba(0,200,255,.1);--blue-glow:rgba(0,200,255,.2);
  --green:#00e5a0;--green-dim:rgba(0,229,160,.1);
  --red:#ff4f6b;--red-dim:rgba(255,79,107,.1);
  --yellow:#ffd166;--yellow-dim:rgba(255,209,102,.1);
  --purple:#b57bee;--purple-dim:rgba(181,123,238,.1);
  --text:#b8c5e0;--text-dim:#3d4d68;--text-bright:#e8f0ff;
  --orange:#FF7B54;--orange-dim:rgba(255,123,84,.12);
  --mono:'JetBrains Mono',monospace;--sans:'Sora',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:.18;pointer-events:none;z-index:0}
.wrap{max-width:980px;margin:0 auto;padding:2.5rem 1.5rem 100px;position:relative;z-index:1}

/* ─── ONBOARDING ─── */
#onboarding{position:fixed;inset:0;background:rgba(4,6,12,.93);backdrop-filter:blur(14px);z-index:500;display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:fadeIn .35s ease}
#onboarding.hidden{display:none}
.ob-card{background:var(--surface);border:1px solid rgba(0,200,255,.2);border-radius:20px;padding:2.6rem 2.3rem;max-width:440px;width:100%;box-shadow:0 0 0 1px rgba(0,200,255,.05),0 40px 80px rgba(0,0,0,.7);position:relative}
.ob-card::after{content:'';position:absolute;inset:-1px;border-radius:21px;background:linear-gradient(135deg,rgba(0,200,255,.12),transparent 55%);z-index:-1;pointer-events:none}
.ob-badge{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);background:var(--blue-dim);border:1px solid rgba(0,200,255,.2);padding:.25rem .8rem;border-radius:20px;display:inline-block;margin-bottom:1.6rem}
.ob-card h2{font-size:1.65rem;font-weight:700;color:var(--text-bright);letter-spacing:-.03em;line-height:1.2;margin-bottom:.55rem}
.ob-card h2 em{color:var(--blue);font-style:normal}
.ob-card > p{font-size:.82rem;color:var(--text-dim);line-height:1.65;margin-bottom:1.8rem}
.ob-field{position:relative;margin-bottom:.5rem}
.ob-field-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;z-index:1}
.ob-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:.85rem 1rem .85rem 2.9rem;font-family:var(--sans);font-size:.95rem;color:var(--text-bright);outline:none;transition:border-color .2s,box-shadow .2s}
.ob-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-dim)}
.ob-input::placeholder{color:var(--text-dim)}
.ob-err{font-family:var(--mono);font-size:.65rem;color:var(--red);min-height:1.2em;display:block;margin-bottom:.6rem;padding-left:.2rem}
.ob-submit{width:100%;padding:.9rem;background:var(--blue);color:#000;font-family:var(--sans);font-size:.95rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:.01em}
.ob-submit:hover{background:#33d4ff;box-shadow:0 6px 24px var(--blue-glow);transform:translateY(-1px)}
.ob-divider{display:flex;align-items:center;gap:.75rem;margin:1.4rem 0 1rem;color:var(--text-dim);font-size:.72rem}
.ob-divider::before,.ob-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.ob-chips{display:flex;flex-wrap:wrap;gap:.45rem}
.ob-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:.4rem .85rem;font-size:.78rem;color:var(--text);cursor:pointer;transition:all .15s;user-select:none}
.ob-chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
.ob-chip-av{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:700;color:#000;flex-shrink:0}

/* ─── HEADER ─── */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.9rem}
.logo-icon{width:40px;height:40px;background:var(--blue-dim);border:1px solid rgba(0,200,255,.25);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.logo-text h1{font-size:1.1rem;font-weight:700;color:var(--text-bright);letter-spacing:-.02em}
.logo-text p{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);letter-spacing:.08em;margin-top:.1rem;text-transform:uppercase}

/* User pill */
.upw{position:relative}
.upill{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:.35rem .85rem .35rem .38rem;cursor:pointer;transition:all .2s;user-select:none}
.upill:hover,.upill.open{border-color:rgba(0,200,255,.3);background:var(--blue-dim)}
.uav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:#000;flex-shrink:0}
.uname{font-size:.82rem;font-weight:600;color:var(--text-bright)}
.ucaret{font-size:.6rem;color:var(--text-dim);transition:transform .2s}
.upill.open .ucaret{transform:rotate(180deg)}

/* Dropdown */
.uddrop{position:absolute;top:calc(100%+.5rem);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.45rem;min-width:210px;box-shadow:0 16px 48px rgba(0,0,0,.55);z-index:200;animation:dropIn .18s ease;display:none}
.uddrop.open{display:block}
.ud-lbl{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);padding:.35rem .65rem .25rem;display:block}
.ud-row{display:flex;align-items:center;gap:.55rem;padding:.5rem .65rem;border-radius:7px;cursor:pointer;transition:background .12s}
.ud-row:hover{background:var(--surface2)}
.ud-row.cur{background:var(--blue-dim)}
.ud-rav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#000;flex-shrink:0}
.ud-rname{font-size:.8rem;color:var(--text-bright);flex:1}
.ud-check{color:var(--blue);font-size:.72rem}
.ud-sep{height:1px;background:var(--border);margin:.35rem 0}
.ud-act{display:flex;align-items:center;gap:.55rem;padding:.5rem .65rem;border-radius:7px;cursor:pointer;transition:background .12s;font-size:.8rem;color:var(--text-dim)}
.ud-act:hover{background:var(--surface2);color:var(--text)}
.ud-act.danger:hover{color:var(--red)}

/* ─── STATS ─── */
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:2.5rem}
.gstat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.1rem;position:relative;overflow:hidden}
.gstat::after{content:'';position:absolute;top:0;right:0;width:3px;height:100%;border-radius:0 10px 10px 0}
.g1::after{background:var(--blue)}.g2::after{background:var(--green)}.g3::after{background:var(--yellow)}.g4::after{background:var(--purple)}
.gv{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--text-bright);line-height:1}
.gl{font-size:.7rem;color:var(--text-dim);margin-top:.35rem}
.gsub{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);margin-top:.2rem}

/* ─── SECTION TITLE ─── */
.stitle{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin-bottom:1rem;display:flex;align-items:center;gap:.75rem}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}

/* ─── SUBJECT CARDS ─── */
.scard{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:1.5rem;overflow:hidden;animation:fadeUp .4s ease both}
.scard:nth-child(2){animation-delay:.08s}
.shdr{display:flex;align-items:center;gap:1.2rem;padding:1.5rem 1.8rem;border-bottom:1px solid var(--border);position:relative}
.sbar{position:absolute;top:0;left:0;width:4px;height:100%}
.sicon{font-size:1.6rem;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.sinfo h2{font-size:1.1rem;font-weight:700;color:var(--text-bright);letter-spacing:-.02em;margin-bottom:.2rem}
.sinfo p{font-size:.75rem;color:var(--text-dim)}
.sright{display:flex;flex-direction:column;align-items:flex-end;gap:.55rem;flex-shrink:0}
.sring{position:relative;width:60px;height:60px}
.sring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{stroke:var(--surface2);stroke-width:5;fill:none}
.rg-fill{stroke-width:5;fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.rg-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.75rem;font-weight:700;color:var(--text-bright)}
.sbtn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1.1rem;border-radius:8px;font-family:var(--sans);font-size:.78rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;border:none}
.em-btn{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(0,200,255,.25)}
.em-btn:hover{background:rgba(0,200,255,.2);box-shadow:0 4px 16px var(--blue-glow)}
.pm-btn{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(181,123,238,.25)}
.pm-btn:hover{background:rgba(181,123,238,.2)}

/* ─── CHAPTER TABLE ─── */
.ctable{padding:0 1.8rem 1.5rem}
.crow{display:flex;align-items:center;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--border)}
.crow:last-child{border-bottom:none}
.cname{width:190px;flex-shrink:0}
.cname .cn{font-size:.82rem;font-weight:600;color:var(--text-bright)}
.cname .cs{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);margin-top:.1rem}
.cbwrap{flex:1}
.cbbg{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:.3rem}
.cbfill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.cblabels{display:flex;justify-content:space-between}
.cpct{font-family:var(--mono);font-size:.65rem;font-weight:600}
.csess{font-family:var(--mono);font-size:.62rem;color:var(--text-dim)}
.cbadge-wrap{flex-shrink:0;width:78px;text-align:right}
.badge{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:.2rem .55rem;border-radius:20px}
.b-none{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}
.b-low{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,79,107,.25)}
.b-mid{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,.25)}
.b-good{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,229,160,.25)}
.b-top{background:linear-gradient(135deg,rgba(0,200,255,.12),rgba(0,229,160,.12));color:var(--blue);border:1px solid rgba(0,200,255,.3)}
.clast{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);flex-shrink:0;width:70px;text-align:right}
.empty{text-align:center;padding:1.8rem 1rem;font-size:.78rem;color:var(--text-dim)}

/* ─── HISTORY ─── */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:.7rem}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem}
.hdate{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);margin-bottom:.45rem}
.hch{font-size:.78rem;font-weight:600;color:var(--text-bright);margin-bottom:.55rem}
.hscore{display:flex;align-items:center;gap:.5rem}
.hsbg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.hsfill{height:100%;border-radius:2px}
.hspct{font-family:var(--mono);font-size:.72rem;font-weight:700;width:36px;text-align:right;flex-shrink:0}
.hdetail{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);margin-top:.3rem}

/* ─── COMING SOON ─── */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:.7rem}
.ccard{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:1.4rem;opacity:.4;text-align:center}
.ccard .ci{font-size:1.7rem;margin-bottom:.5rem}
.ccard h3{font-size:.82rem;font-weight:600;color:var(--text-bright);margin-bottom:.2rem}
.ccard p{font-size:.7rem;color:var(--text-dim)}

/* ─── SAVE PANEL ─── */
.spanel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.8rem;margin-top:2rem}
.sp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.6rem}
.sp-top h3{font-size:.88rem;font-weight:600;color:var(--text-bright)}
.sp-top h3 span{color:var(--blue)}
.sp-badge{font-family:var(--mono);font-size:.62rem;padding:.25rem .7rem;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim)}
.sp-badge.saved{border-color:rgba(0,229,160,.3);background:rgba(0,229,160,.06);color:var(--green)}
.sp-actions{display:flex;gap:.6rem;flex-wrap:wrap}
.sp-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:8px;font-family:var(--sans);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.sp-export{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,229,160,.25)}
.sp-export:hover{background:rgba(0,229,160,.2);transform:translateY(-1px)}
.sp-import{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(0,200,255,.25)}
.sp-import:hover{background:rgba(0,200,255,.2);transform:translateY(-1px)}
.sp-reset{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.sp-reset:hover{border-color:var(--red);color:var(--red)}
.sp-hint{margin-top:.85rem;padding-top:.85rem;border-top:1px solid var(--border);display:flex;gap:1.2rem;flex-wrap:wrap}
.sp-hint span{font-size:.7rem;color:var(--text-dim);display:flex;align-items:center;gap:.35rem}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ─── TOAST ─── */
#toasts{position:fixed;bottom:1.5rem;right:1.5rem;display:flex;flex-direction:column;gap:.45rem;z-index:600;pointer-events:none}
.toast{display:flex;align-items:center;gap:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem .95rem;font-size:.8rem;color:var(--text-bright);box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:all;animation:toastIn .25s ease;max-width:290px}
.tok{border-color:rgba(0,229,160,.35)}.terr{border-color:rgba(255,79,107,.35)}.tinf{border-color:rgba(0,200,255,.35)}
.tx{margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.8rem;padding:0 0 0 .35rem;flex-shrink:0}
.tx:hover{color:var(--text)}

/* ─── CLOUD SYNC ─── */
.sync-section{margin-top:1.1rem;padding-top:1.1rem;border-top:1px solid var(--border)}
.sync-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:.5rem}
.sync-title h4{font-size:.82rem;font-weight:600;color:var(--text-bright);display:flex;align-items:center;gap:.45rem}
.sync-status{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.63rem}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.on{background:var(--green);box-shadow:0 0 6px rgba(0,229,160,.5)}
.sync-dot.off{background:var(--text-dim)}
.sync-dot.pulse{animation:sdpulse 1.5s ease infinite}
@keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-setup{display:flex;flex-direction:column;gap:.6rem}
.sync-setup p{font-size:.75rem;color:var(--text-dim);line-height:1.55}
.sync-setup a{color:var(--blue);text-decoration:none;font-size:.75rem}
.sync-setup a:hover{text-decoration:underline}
.sync-input-row{display:flex;gap:.5rem;flex-wrap:wrap}
.sync-token-input{flex:1;min-width:180px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:.6rem .9rem;font-family:var(--mono);font-size:.78rem;color:var(--text-bright);outline:none;transition:border-color .2s}
.sync-token-input:focus{border-color:var(--blue)}
.sync-token-input::placeholder{color:var(--text-dim)}
.sync-btn{display:inline-flex;align-items:center;gap:.35rem;padding:.6rem 1rem;border-radius:8px;font-family:var(--sans);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.sc-connect{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(0,200,255,.25)}
.sc-connect:hover{background:rgba(0,200,255,.2)}
.sc-push{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,229,160,.25)}
.sc-push:hover{background:rgba(0,229,160,.2)}
.sc-pull{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(181,123,238,.25)}
.sc-pull:hover{background:rgba(181,123,238,.2)}
.sc-find{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(255,209,102,.25)}
.sc-find:hover{background:rgba(255,209,102,.2)}
.sc-disc{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.sc-disc:hover{border-color:var(--red);color:var(--red)}
.sc-btn:disabled,.sync-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.sync-controls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.sync-info{font-family:var(--mono);font-size:.62rem;color:var(--text-dim);display:flex;align-items:center;gap:.4rem;margin-top:.6rem}
.sync-autosync{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--text);cursor:pointer;user-select:none;margin-left:auto}
.sync-autosync input{display:none}
.auto-toggle{width:32px;height:18px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;position:relative;transition:all .2s;flex-shrink:0}
.auto-toggle::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--text-dim);transition:all .2s}
.sync-autosync input:checked+.auto-toggle{background:var(--green-dim);border-color:var(--green)}
.sync-autosync input:checked+.auto-toggle::after{left:16px;background:var(--green)}
footer p{font-family:var(--mono);font-size:.6rem;color:var(--text-dim)}

/* ─── ANIMS ─── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}

@media(max-width:640px){
  .gstats{grid-template-columns:repeat(2,1fr)}
  .shdr{flex-wrap:wrap}.cname{width:130px}.clast{display:none}
  header{flex-direction:column;align-items:flex-start}
}

footer><p>FGE2-S4 · Révisions Physique · EPF Engineering</p></footer>
</div>

<div id="toasts"></div>

<script>
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const CHAPTERS = {
  em_ondes:       {label:'Ondes EM',             sub:'em', color:'var(--blue)',   n:25},
  em_induction:   {label:'Induction',            sub:'em', color:'var(--blue)',   n:25},
  rel_restreinte: {label:'Relativité restreinte',sub:'pm', color:'var(--purple)',n:25},
  meca_quant:     {label:'Mécanique quantique',  sub:'pm', color:'var(--green)', n:25},
};
const SUBS = {
  em:{chs:['em_ondes','em_induction']},
  pm:{chs:['rel_restreinte','meca_quant']},
};
const COLORS = ['#00c8ff','#00e5a0','#b57bee','#ff9f43','#ff4f6b','#ffd166','#54a0ff','#ff6b81'];
const avc = n => { let h=0; for(let c of n) h=(h*31+c.charCodeAt(0))&0xffffffff; return COLORS[Math.abs(h)%COLORS.length]; };
const ini = n => n.slice(0,2).toUpperCase();

// ══════════════════════════════════════════
// STORAGE (namespaced by user)
// ══════════════════════════════════════════
const KU='pq_users', KC='pq_current';
const sk=u=>`pq_sc_${u}`, ek=u=>`pq_ex_${u}`;
const getUsers=()=>{try{return JSON.parse(localStorage.getItem(KU)||'[]')}catch{return[]}};
const getCur=()=>localStorage.getItem(KC)||null;
const setCur=u=>localStorage.setItem(KC,u);
const addUser=u=>{const l=getUsers();if(!l.includes(u)){l.push(u);localStorage.setItem(KU,JSON.stringify(l))}};
const rmUser=u=>{const l=getUsers().filter(x=>x!==u);localStorage.setItem(KU,JSON.stringify(l))};
const loadSc=u=>{try{return JSON.parse(localStorage.getItem(sk(u))||'{}')}catch{return{}}};
const saveSc=(u,d)=>localStorage.setItem(sk(u),JSON.stringify(d));

// ══════════════════════════════════════════
// ONBOARDING
// ══════════════════════════════════════════
function showOB() {
  document.getElementById('app').style.display='none';
  const ob=document.getElementById('onboarding');
  ob.classList.remove('hidden');
  const users=getUsers();
  const wrap=document.getElementById('ob-existing-wrap');
  const chips=document.getElementById('ob-chips');
  chips.innerHTML='';
  if(users.length){
    wrap.style.display='block';
    users.forEach(u=>{
      const c=document.createElement('div');
      c.className='ob-chip';
      c.innerHTML=`<div class="ob-chip-av" style="background:${avc(u)}">${ini(u)}</div>${u}`;
      c.onclick=()=>switchUser(u);
      chips.appendChild(c);
    });
  } else wrap.style.display='none';
  setTimeout(()=>document.getElementById('ob-input').focus(),80);
}
function openOB(){closeDrop();showOB();}

function createProfile(){
  const v=document.getElementById('ob-input').value.trim();
  const err=document.getElementById('ob-err');
  if(!v){err.textContent='Saisis un prénom ou un pseudo.';return;}
  if(v.length<2){err.textContent='Au moins 2 caractères.';return;}
  if(!/^[a-zA-ZÀ-ÿ0-9_\-. ]+$/.test(v)){err.textContent='Caractères invalides.';return;}
  err.textContent='';
  addUser(v);setCur(v);
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('ob-input').value='';
  loadApp();
  toast(`Bienvenue ${v} ! 👋`,'tok');
}
function switchUser(u){setCur(u);document.getElementById('onboarding').classList.add('hidden');closeDrop();loadApp();}

document.getElementById('ob-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')createProfile();
  document.getElementById('ob-err').textContent='';
});

// ══════════════════════════════════════════
// APP LOAD
// ══════════════════════════════════════════
function loadApp(){
  const u=getCur();
  if(!u||!getUsers().includes(u)){showOB();return;}
  document.getElementById('app').style.display='block';
  const now=new Date();
  document.getElementById('hdate').textContent=now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'}).toUpperCase();
  // User pill
  const col=avc(u);
  const av=document.getElementById('uav');
  av.textContent=ini(u);av.style.background=col;
  document.getElementById('uname').textContent=u;
  // Links
  const enc=encodeURIComponent(u);
  document.getElementById('bem').href=`quiz_physique.html?subject=em&user=${enc}`;
  document.getElementById('bpm').href=`quiz_physique.html?subject=pm&user=${enc}`;
  // Save panel
  document.getElementById('sp-uname').textContent=u;
  updateBadge(u);
  updateSyncUI(u);
  // Data
  renderDash(u);
  renderDrop(u);
}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function renderDash(u){
  const sc=loadSc(u);
  let sess=0,qs=0,bests=[],bname='—',bpct=-1;
  Object.entries(CHAPTERS).forEach(([k,ch])=>{
    const d=sc[k];if(!d?.sessions?.length)return;
    sess+=d.sessions.length;
    qs+=d.sessions.reduce((s,x)=>s+(x.total||0),0);
    if(d.best>0)bests.push(d.best);
    if(d.best>bpct){bpct=d.best;bname=ch.label.split(' ').slice(0,2).join(' ');}
  });
  const avg=bests.length?Math.round(bests.reduce((a,b)=>a+b,0)/bests.length):null;
  setEl('gs1',sess||'—');setEl('gs2',qs||'—');
  setEl('gs3',avg!==null?avg+'%':'—');
  setEl('gs3s',avg!==null?`${bests.length} ch. joué${bests.length>1?'s':''}`:'');
  setEl('gs4',bpct>0?bname:'—');
  renderSub('em',sc);renderSub('pm',sc);renderHist(sc);
}

function renderSub(sub,sc){
  const chIds=SUBS[sub].chs;
  const tel=document.getElementById(`t${sub}`);
  const rel=document.getElementById(`r${sub}`);
  const lel=document.getElementById(`r${sub}l`);
  const bests=chIds.map(k=>sc[k]?.best||0).filter(v=>v>0);
  const avg=bests.length?Math.round(bests.reduce((a,b)=>a+b,0)/bests.length):null;
  const C=2*Math.PI*24;
  rel.style.strokeDasharray=C;
  rel.style.strokeDashoffset=avg!==null?C*(1-avg/100):C;
  rel.style.stroke=avg===null?'var(--text-dim)':avg>=80?'var(--green)':avg>=55?'var(--yellow)':'var(--red)';
  lel.textContent=avg!==null?avg+'%':'—';
  const has=chIds.some(k=>sc[k]?.sessions?.length>0);
  if(!has){tel.innerHTML='<div class="empty">Lance un quiz pour voir ta progression ici.</div>';return;}
  tel.innerHTML='';
  chIds.forEach(k=>{
    const ch=CHAPTERS[k],d=sc[k];
    const best=d?.best||0,sess=d?.sessions?.length||0,last=d?.last?fmtDate(d.last):'';
    let bc,bt;
    if(!sess){bc='b-none';bt='—';}
    else if(best>=90){bc='b-top';bt='★ '+best+'%';}
    else if(best>=70){bc='b-good';bt='✓ '+best+'%';}
    else if(best>=50){bc='b-mid';bt='~ '+best+'%';}
    else{bc='b-low';bt='✗ '+best+'%';}
    const bc2=best>=80?'var(--green)':best>=55?'var(--yellow)':best>0?'var(--red)':'var(--surface2)';
    const pc2=best>=80?'var(--green)':best>=55?'var(--yellow)':best>0?'var(--red)':'var(--text-dim)';
    const row=document.createElement('div');row.className='crow';
    row.innerHTML=`<div class="cname"><div class="cn">${ch.label}</div><div class="cs">${ch.n} questions</div></div>
      <div class="cbwrap"><div class="cbbg"><div class="cbfill" style="width:0%;background:${bc2}" data-w="${best}"></div></div>
      <div class="cblabels"><span class="cpct" style="color:${pc2}">${best>0?'Meilleur : '+best+'%':'Pas encore joué'}</span>
      <span class="csess">${sess>0?sess+' session'+(sess>1?'s':''):''}</span></div></div>
      <div class="cbadge-wrap"><span class="badge ${bc}">${bt}</span></div>
      <div class="clast">${last}</div>`;
    tel.appendChild(row);
  });
  setTimeout(()=>tel.querySelectorAll('.cbfill').forEach(b=>{b.style.width=b.dataset.w+'%';}),80);
}

function renderHist(sc){
  const all=[];
  Object.entries(sc).forEach(([k,d])=>{if(!d.sessions)return;d.sessions.forEach(s=>all.push({...s,k}));});
  const sec=document.getElementById('hist-section');
  if(!all.length){sec.style.display='none';return;}
  all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sec.style.display='block';
  const g=document.getElementById('hgrid');g.innerHTML='';
  all.slice(0,8).forEach(s=>{
    const ch=CHAPTERS[s.k];if(!ch)return;
    const col=s.pct>=80?'var(--green)':s.pct>=55?'var(--yellow)':'var(--red)';
    const c=document.createElement('div');c.className='hcard';
    c.innerHTML=`<div class="hdate">${fmtDate(s.date)}</div><div class="hch">${ch.label}</div>
      <div class="hscore"><div class="hsbg"><div class="hsfill" style="width:${s.pct}%;background:${col}"></div></div>
      <span class="hspct" style="color:${col}">${s.pct}%</span></div>
      <div class="hdetail">${s.correct}/${s.total} correctes</div>`;
    g.appendChild(c);
  });
}

// DROPDOWN
// ══════════════════════════════════════════
function renderDrop(cur){
  const users=getUsers();
  const list=document.getElementById('ud-list');list.innerHTML='';
  users.forEach(u=>{
    const col=avc(u);
    const r=document.createElement('div');r.className='ud-row'+(u===cur?' cur':'');
    r.innerHTML=`<div class="ud-rav" style="background:${col}">${ini(u)}</div><span class="ud-rname">${u}</span>${u===cur?'<span class="ud-check">✓</span>':''}`;
    r.onclick=()=>{if(u!==cur)switchUser(u);else closeDrop();};
    list.appendChild(r);
  });
}
function toggleDrop(){const d=document.getElementById('uddrop');const p=document.getElementById('upill');if(d.classList.contains('open')){closeDrop();}else{p.classList.add('open');d.classList.add('open');}}
function closeDrop(){document.getElementById('upill').classList.remove('open');document.getElementById('uddrop').classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.upw'))closeDrop();});

function deleteProfile(){
  const u=getCur();
  if(!confirm(`Supprimer le profil "${u}" et tous ses scores ?\nAction irréversible.`))return;
  localStorage.removeItem(sk(u));localStorage.removeItem(ek(u));
  rmUser(u);closeDrop();
  const rem=getUsers();
  if(rem.length){setCur(rem[0]);loadApp();}
  else{localStorage.removeItem(KC);showOB();}
  toast(`Profil "${u}" supprimé.`,'tinf');
}

// ══════════════════════════════════════════
// EXPORT / IMPORT
// ══════════════════════════════════════════
function doExport(){
  const u=getCur();const sc=loadSc(u);
  if(!Object.keys(sc).length){toast('Aucun score à exporter.','terr');return;}
  const payload={version:1,user:u,exported:new Date().toISOString(),app:'quiz-physique-fge2',scores:sc};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`scores_${u.replace(/\s+/g,'_')}_${new Date().toISOString().split('T')[0]}.json`;
  a.click();URL.revokeObjectURL(url);
  localStorage.setItem(ek(u),new Date().toISOString());
  updateBadge(u);toast(`Scores de ${u} exportés ✓`,'tok');
}

function doImport(ev){
  const file=ev.target.files[0];if(!file)return;ev.target.value='';
  const u=getCur();const ld=toast('Lecture…','tinf',0);
  const r=new FileReader();
  r.onload=e=>{
    ld.remove();
    try{
      const p=JSON.parse(e.target.result);
      if(!p.scores||typeof p.scores!=='object'){toast('Format invalide.','terr');return;}
      if(p.user&&p.user!==u&&!confirm(`Ce fichier appartient à "${p.user}".\nImporter dans le profil "${u}" ?`))return;
      const ex=loadSc(u);const mg={...ex};let added=0;
      Object.entries(p.scores).forEach(([k,d])=>{
        if(!d?.sessions)return;
        if(!mg[k]){mg[k]=d;added+=d.sessions.length;return;}
        const xk=new Set((mg[k].sessions||[]).map(s=>`${s.date}-${s.pct}-${s.total}`));
        const ns=d.sessions.filter(s=>!xk.has(`${s.date}-${s.pct}-${s.total}`));
        mg[k].sessions=[...(mg[k].sessions||[]),...ns].slice(-30);
        mg[k].best=Math.max(mg[k].best||0,d.best||0);
        if(d.last&&(!mg[k].last||d.last>mg[k].last))mg[k].last=d.last;
        added+=ns.length;
      });
      saveSc(u,mg);localStorage.setItem(ek(u),new Date().toISOString());
      updateBadge(u);renderDash(u);
      const from=p.exported?new Date(p.exported).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'?';
      toast(`${added} session${added>1?'s':''} importée${added>1?'s':''} (du ${from})`,'tok',5000);
    }catch{toast('Fichier JSON corrompu.','terr');}
  };
  r.onerror=()=>{ld.remove();toast('Erreur de lecture.','terr');};
  r.readAsText(file);
}

function updateBadge(u){
  const el=document.getElementById('sp-badge');
  const raw=localStorage.getItem(ek(u));
  if(!raw){el.textContent='Aucun export';el.className='sp-badge';return;}
  const d=new Date(raw);
  el.textContent='Export : '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  el.className='sp-badge saved';
}

function doReset(){
  const u=getCur();
  if(!confirm(`Réinitialiser tous les scores de "${u}" ?\nConseil : exporte d'abord.`))return;
  saveSc(u,{});renderDash(u);toast(`Scores de ${u} réinitialisés.`,'tinf');
}

// UTILS
// ══════════════════════════════════════════
const setEl=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
const fmtDate=s=>{if(!s)return'';const d=new Date(s+'T12:00:00'),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);if(d.toDateString()===t.toDateString())return"Aujourd'hui";if(d.toDateString()===y.toDateString())return'Hier';return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});};

function toast(msg,cls='tinf',dur=4000){
  const icons={tok:'✅',terr:'❌',tinf:'💡'};
  const w=document.getElementById('toasts');
  const t=document.createElement('div');t.className=`toast ${cls}`;
  t.innerHTML=`<span>${icons[cls]||'💡'}</span><span style="flex:1">${msg}</span><button class="tx" onclick="this.parentElement.remove()">✕</button>`;
  w.appendChild(t);
  if(dur>0)setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(12px)';t.style.transition='.25s';setTimeout(()=>t.remove(),250);},dur);
  return t;
}

// ══════════════════════════════════════════
// GITHUB GIST SYNC
// ══════════════════════════════════════════
const TK  = 'pq_gh_token';
const gk  = u => `pq_gist_${u}`;
const lsk = u => `pq_sync_${u}`;
const ask = 'pq_auto_sync';

const getToken  = () => localStorage.getItem(TK) || '';
const setToken  = t  => t ? localStorage.setItem(TK,t) : localStorage.removeItem(TK);
const getGistId = u  => localStorage.getItem(gk(u)) || '';
const setGistId = (u,id) => localStorage.setItem(gk(u), id);
const getAutoSync = () => localStorage.getItem(ask) === '1';

function connectGitHub() {
  const t = document.getElementById('gh-token-input').value.trim();
  if (!t || !t.startsWith('gh')) {
    toast('Token invalide — il doit commencer par "ghp_" ou "github_pat_".', 'terr'); return;
  }
  setToken(t);
  document.getElementById('gh-token-input').value = '';
  updateSyncUI(getCur());
  toast('Token GitHub enregistré ✓', 'tok');
}

function disconnectGitHub() {
  if (!confirm('Déconnecter GitHub ? Le token sera supprimé de ce navigateur.\nTes scores locaux restent intacts.')) return;
  setToken('');
  updateSyncUI(getCur());
  toast('Déconnecté de GitHub.', 'tinf');
}

function toggleAutoSync(on) {
  localStorage.setItem(ask, on ? '1' : '0');
}

function updateSyncUI(user) {
  const hasToken = !!getToken();
  const hasGist  = !!getGistId(user);
  document.getElementById('sync-setup').style.display    = hasToken ? 'none'  : '';
  document.getElementById('sync-controls').style.display = hasToken ? ''      : 'none';

  // Dot + status text
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-status-txt');
  if (!hasToken) {
    dot.className = 'sync-dot off'; txt.textContent = 'Non connecté'; txt.style.color = 'var(--text-dim)';
  } else if (hasGist) {
    dot.className = 'sync-dot on'; txt.textContent = 'Connecté · Gist actif'; txt.style.color = 'var(--green)';
  } else {
    dot.className = 'sync-dot off'; txt.textContent = 'Connecté · Pas encore synchronisé'; txt.style.color = 'var(--yellow)';
  }

  // Pull button only if gist exists
  const btnPull = document.getElementById('btn-pull');
  if (btnPull) btnPull.disabled = !hasGist;

  // Auto-sync checkbox
  const asc = document.getElementById('auto-sync-toggle');
  if (asc) asc.checked = getAutoSync();

  // Gist link + last sync
  const gistLink = document.getElementById('sync-gist-link');
  const lastTime = document.getElementById('sync-last-time');
  if (hasGist && gistLink) {
    gistLink.innerHTML = `<a href="https://gist.github.com/${getGistId(user)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">→ Voir le Gist</a>`;
  } else if (gistLink) {
    gistLink.innerHTML = '';
  }
  const ls = localStorage.getItem(lsk(user));
  if (ls && lastTime) {
    const d = new Date(ls);
    lastTime.textContent = 'Dernier sync : ' + d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  } else if (lastTime) {
    lastTime.textContent = '';
  }
}

async function syncUp(silent = false) {
  const user  = getCur();
  const token = getToken();
  if (!token) { toast('Configure un token GitHub d\'abord.', 'terr'); return; }

  const scores  = loadSc(user);
  const content = JSON.stringify({version:1, user, synced:new Date().toISOString(), app:'quiz-physique-fge2', scores}, null, 2);
  const filename = `scores_${user.replace(/\s+/g,'_')}.json`;

  setBtnLoading('btn-push', true);
  try {
    let gistId = getGistId(user);
    if (gistId) {
      const r = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body: JSON.stringify({files:{[filename]:{content}}})
      });
      if (r.status === 404) {
        // Gist was deleted — create a new one
        setGistId(user, '');
        gistId = '';
      } else if (!r.ok) {
        const err = await r.json();
        throw new Error(err.message || r.status);
      }
    }
    if (!gistId) {
      const r = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {'Authorization':`Bearer ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
        body: JSON.stringify({description:`Quiz FGE2-S4 — Scores de ${user}`, public:false, files:{[filename]:{content}}})
      });
      if (!r.ok) { const e=await r.json(); throw new Error(e.message||r.status); }
      const g = await r.json();
      setGistId(user, g.id);
    }
    localStorage.setItem(lsk(user), new Date().toISOString());
    updateSyncUI(user);
    if (!silent) toast('Scores pushés vers le cloud ☁️ ✓', 'tok');
  } catch(e) {
    toast(`Push échoué : ${e.message}`, 'terr');
  }
  setBtnLoading('btn-push', false);
}

async function syncDown() {
  const user  = getCur();
  const token = getToken();
  const gistId = getGistId(user);
  if (!token) { toast('Configure un token GitHub d\'abord.', 'terr'); return; }
  if (!gistId) { toast('Aucun Gist trouvé. Fais d\'abord un Push ou utilise "Trouver".', 'terr'); return; }

  setBtnLoading('btn-pull', true);
  try {
    const r = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: {'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json'}
    });
    if (!r.ok) { const e=await r.json(); throw new Error(e.message||r.status); }
    const g = await r.json();

    // Find the scores file (any filename match)
    const file = Object.values(g.files).find(f => f.filename.startsWith('scores_') && f.filename.endsWith('.json'));
    if (!file?.content) throw new Error('Fichier introuvable dans le Gist');

    const p = JSON.parse(file.content);
    const existing = loadSc(user);
    const merged = {...existing};
    let added = 0;
    Object.entries(p.scores||{}).forEach(([k,d])=>{
      if(!d?.sessions)return;
      if(!merged[k]){merged[k]=d;added+=d.sessions.length;return;}
      const xk=new Set((merged[k].sessions||[]).map(s=>`${s.date}-${s.pct}-${s.total}`));
      const ns=d.sessions.filter(s=>!xk.has(`${s.date}-${s.pct}-${s.total}`));
      merged[k].sessions=[...(merged[k].sessions||[]),...ns].slice(-30);
      merged[k].best=Math.max(merged[k].best||0,d.best||0);
      if(d.last&&(!merged[k].last||d.last>merged[k].last))merged[k].last=d.last;
      added+=ns.length;
    });
    saveSc(user, merged);
    localStorage.setItem(lsk(user), new Date().toISOString());
    updateSyncUI(user);
    renderDash(user);
    toast(`${added ? added+` session${added>1?'s':''} récupérée${added>1?'s':''}` : 'Déjà à jour'} ✓`, 'tok');
  } catch(e) {
    toast(`Pull échoué : ${e.message}`, 'terr');
  }
  setBtnLoading('btn-pull', false);
}

async function findGist() {
  const user  = getCur();
  const token = getToken();
  if (!token) { toast('Configure un token GitHub d\'abord.', 'terr'); return; }

  setBtnLoading('btn-find', true);
  try {
    // Fetch user's gists (up to 100)
    const r = await fetch('https://api.github.com/gists?per_page=100', {
      headers: {'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json'}
    });
    if (!r.ok) { const e=await r.json(); throw new Error(e.message||r.status); }
    const gists = await r.json();

    // Look for a gist with our app description or a matching filename
    const safeName = user.replace(/\s+/g,'_');
    const match = gists.find(g =>
      g.description?.includes('Quiz FGE2-S4') ||
      Object.keys(g.files).some(f => f === `scores_${safeName}.json` || f.startsWith('scores_'))
    );

    if (match) {
      setGistId(user, match.id);
      localStorage.setItem(lsk(user), new Date().toISOString());
      updateSyncUI(user);
      toast(`Gist trouvé ! (${match.description || match.id.slice(0,8)+'…'}) — Pull pour récupérer tes scores.`, 'tok', 6000);
    } else {
      toast('Aucun Gist trouvé pour ce profil. Fais un Push pour en créer un.', 'tinf', 5000);
    }
  } catch(e) {
    toast(`Recherche échouée : ${e.message}`, 'terr');
  }
  setBtnLoading('btn-find', false);
}

// Called by quiz_physique.html after each quiz if auto-sync enabled
async function autoSyncIfEnabled() {
  if (getAutoSync() && getToken()) await syncUp(true);
}

function setBtnLoading(id, on) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = on;
  if (on) { btn.dataset.orig = btn.textContent; btn.innerHTML = '<span class="sync-dot pulse" style="display:inline-block;margin-right:.3rem"></span>…'; }
  else { btn.textContent = btn.dataset.orig || btn.textContent; }
}

function copyShareLink() {
  const token = getToken();
  if (!token) return;
  // Encode token in base64 to avoid it being too obvious in the URL
  const encoded = btoa(token);
  const base = window.location.href.split('?')[0];
  const link = `${base}?setup=${encoded}`;
  navigator.clipboard.writeText(link).then(() => {
    toast('Lien copié ! Envoie-le à tes amis — ils n\'auront qu\'à entrer leur prénom.', 'tok', 6000);
  }).catch(() => {
    // Fallback: show in prompt
    prompt('Copie ce lien et envoie-le à tes amis :', link);
  });
}

// ══════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════
(()=>{
  // Auto-configure token from share link ?setup=BASE64TOKEN
  const params = new URLSearchParams(window.location.search);
  const setup = params.get('setup');
  if (setup && !getToken()) {
    try {
      const token = atob(setup);
      if (token.startsWith('gh')) {
        setToken(token);
        // Clean URL so token doesn't stay in browser history
        window.history.replaceState({}, '', window.location.pathname);
        // Show onboarding with a welcome message
        setTimeout(() => toast('Token configuré automatiquement ✓ — entre ton prénom pour commencer !', 'tok', 7000), 600);
      }
    } catch(e) {}
  }

  const u=getCur();
  if(u&&getUsers().includes(u))loadApp();
  else showOB();
})();

</script>
